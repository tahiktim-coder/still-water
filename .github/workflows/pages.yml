# Publishes the game to GitHub Pages on every push to main:
#   /             the release build (dist/index.html, no test mode)
#   /test.html    the test build, with the Skip fish button on, for friends testing the story
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site (release page and test page)
        run: |
          node build.js --test
          mkdir -p site
          cp dist/index.html site/index.html
          cp tools/out/test.html site/test.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
