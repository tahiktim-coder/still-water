# Publishes the game to GitHub Pages on every push to main, one page per language:
#   /                the English release build (no test mode)
#   /test.html       the English test build, with the Skip fish button on, for friends testing the story
#   /ru/             the Russian release build (node build.js --lang=ru)
#   /ru/test.html    the Russian test build (node build.js --lang=ru --test)
# The title of each page links to the other language's (ru/ from the root, ../ back).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site (English and Russian, release and test pages)
        run: |
          node build.js --out=site/index.html
          node build.js --test --out=site/test.html
          node build.js --lang=ru --out=site/ru/index.html
          node build.js --lang=ru --test --out=site/ru/test.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
