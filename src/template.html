<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a33">
<title>Still Water</title>
<meta name="description" content="A short fishing tale">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..500;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* One face (chosen in a font lab over real frames, English and Russian, at phone sizes): Literata, a book serif
   with a strong Cyrillic and an optical-size axis, for every word on screen. The title is pixel lettering on
   the game grid (logoSVG), not type.
   One kind of box (the quiet slab, chosen in a UI lab): every box is one opaque slab in the palette's darkest
   index on the game-pixel grid, a one-game-pixel notch at each corner and a one-game-pixel outline one step
   lighter. UI.colors draws the slabs as tiny SVGs from the live palette (--slab, --raise, --hi, --row) and
   border-image nine-slices them at --k game pixels, so every box recolours with the mood. */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --page-bg: #0a1a33;
  --page-ink: #eaf7ff;
  --ui-solid: #0a1a33;
  --ui-edge: #3673b1;
  --ui-ink: #f1f9ff;
  --ui-pale: #f9fdff;
  --ui-row: #c3def3;
  --ui-dim: #99c4e7;
  --ui-accent: #e2aa2a;
  --slab: none; --raise: none; --hi: none; --row: none; --plate: none; --ask: none; --k: 2;
  --ui-line: #3673b1; /* rings that must read (Cast again, the hollow pips): 3:1 against the slab */
  --u: 3.6px;
  --gp: 1px; /* one game pixel in CSS px, set by resize */
  --font: Literata, 'PT Serif', Georgia, serif;
  --who-fs: max(11px, calc(var(--u) * 2.97)); /* the small size: the speaker labels */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #07142a; --page-ink: #eaf7ff; }
}
:root[data-theme="dark"] { --page-bg: #07142a; --page-ink: #eaf7ff; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  height: 100%;
  background: var(--page-bg);
  color: var(--page-ink);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font); font-optical-sizing: auto; font-synthesis: none;
}
:root[lang="ru"] body { -webkit-hyphens: manual; hyphens: manual; }
#wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#stage {
  position: relative; overflow: hidden; width: 216px; height: 384px;
  font-size: calc(var(--u) * 3.96); line-height: 1.45; color: var(--ui-ink);
  touch-action: none; cursor: pointer;
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
/* Words kept for screen readers only. */
.sr { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* The slab: one opaque box on the game grid (see the head of this sheet). */
.slab { border: 0 solid transparent; border-image: var(--slab) var(--k) fill / calc(var(--gp) * var(--k)) stretch; }
.slab:empty { border-image: none; }
/* Loose text over the picture (the prompt, 'Tap to begin'): a closed one-game-pixel ring in the darkest index
   (the four sides and the four corners), no drop. */
.shade { --o: var(--gp); --n: calc(var(--gp) * -1);
  text-shadow: var(--o) 0 0 var(--ui-solid), var(--n) 0 0 var(--ui-solid), 0 var(--o) 0 var(--ui-solid), 0 var(--n) 0 var(--ui-solid),
    var(--o) var(--o) 0 var(--ui-solid), var(--n) var(--o) 0 var(--ui-solid), var(--o) var(--n) 0 var(--ui-solid), var(--n) var(--n) 0 var(--ui-solid); }
/* A hyphenated word never breaks at its hyphen (что-нибудь); a line typing out keeps its rest laid out but
   unseen (richText), so no word jumps to the next line as it types. */
.nw { white-space: nowrap; }
/* A sentence of a short text (a caption, a bubble, a card's line) is its own box, so lines break between
   sentences where they fit (sentText). */
.sent { display: inline-block; text-wrap: balance; }
.ghost { color: transparent; text-shadow: none; }
/* A bubble whose sentences would take more than three lines flows them as one balanced text (thinkLayout). */
.flow .sent { display: inline; }
/* The pixel markers, drawn with clip-path so no glyph falls back to a system font: a 3 by 5 game-pixel triangle
   pointing right in the label colour before every choice (the panel, the companion's slab, Cast again), 3 game
   pixels before its words and centred on their first line; a 5 by 3 one pointing down for 'more' (the panel,
   the bubble and the catch card). */
.choice .lb::before, #again::before {
  content: ''; position: absolute; width: calc(var(--gp) * 3); height: calc(var(--gp) * 5); background: var(--ui-accent);
  clip-path: polygon(0 0, 33.34% 0, 33.34% 20%, 66.67% 20%, 66.67% 40%, 100% 40%, 100% 60%, 66.67% 60%, 66.67% 80%, 33.34% 80%, 33.34% 100%, 0 100%);
}
.pxmore, #card::after {
  position: absolute; width: calc(var(--gp) * 5); height: calc(var(--gp) * 3); background: var(--ui-accent); opacity: 0;
  clip-path: polygon(0 0, 100% 0, 100% 33.34%, 80% 33.34%, 80% 66.67%, 60% 66.67%, 60% 100%, 40% 100%, 40% 66.67%, 20% 66.67%, 20% 33.34%, 0 33.34%);
}

/* The HUD: the fish count on a small slab, and 44 px buttons, each a 15 by 11 game-pixel slab under a pixel
   icon (Mute, Skip) or a two-letter code (the language link, on the title only). */
#hud {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0; /* set by resize: each slab the same whole game pixels from the edges */
  display: flex; justify-content: space-between; align-items: center;
  font-size: max(11px, calc(var(--u) * 2.97)); font-weight: 500; pointer-events: none;
}
#count { color: var(--ui-ink); line-height: calc(var(--gp) * 11); padding: 0 calc(var(--gp) * 4); text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
#count:empty { visibility: hidden; }
#hudButtons { display: flex; align-items: center; }
#mute, #skip, #lang {
  pointer-events: auto; position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; margin: 0; padding: 0; background: none; border: 0; cursor: pointer;
  font: 500 max(11px, calc(var(--u) * 2.97))/1 var(--font); letter-spacing: 0.08em; color: var(--ui-ink); text-decoration: none;
}
#mute::before, #skip::before, #lang::before {
  content: ''; position: absolute; z-index: -1; left: 50%; top: 50%;
  width: calc(var(--gp) * 15); height: calc(var(--gp) * 11); margin: calc(var(--gp) * -5.5) 0 0 calc(var(--gp) * -7.5);
  border: 0 solid transparent; border-image: var(--slab) var(--k) fill / calc(var(--gp) * var(--k)) stretch;
}
#skip[hidden], #lang[hidden] { display: none; }
#skip { opacity: 0.75; }
.icon { display: block; fill: currentColor; shape-rendering: crispEdges; }
#mute .icon { width: calc(var(--gp) * 9); height: calc(var(--gp) * 7); }
#skip .icon { width: calc(var(--gp) * 7); height: calc(var(--gp) * 5); }
#mute .off, #mute[data-muted="1"] .on { display: none; }
#mute[data-muted="1"] .off { display: block; }
#mute:focus-visible, #skip:focus-visible, #lang:focus-visible { outline: none; }
#mute:focus-visible::before, #skip:focus-visible::before, #lang:focus-visible::before { border-image-source: var(--hi); }
#mute:active, #skip:active, #lang:active { transform: translateY(var(--gp)); }

/* The caption: a slab hugging its words (hug), at the story size, its top on a whole game pixel (resize). On
   the title (only the test build's T key puts one there) it sits low, clear of the name. */
#caption {
  position: absolute; z-index: 5; top: var(--cap-top, 11%); left: 0; right: 0; width: 82%; margin: 0 auto; text-align: center;
  padding: calc(var(--gp) * 3) calc(var(--gp) * 6);
  color: var(--ui-ink); text-wrap: balance;
  opacity: 0; transition: opacity 0.9s ease; pointer-events: none;
}
#caption.on { opacity: 1; }
#caption.whisper { color: var(--ui-dim); letter-spacing: 0.04em; }
#stage.titling #caption { top: auto; bottom: 30%; z-index: 8; }
/* Loose text has one size, the story's, with a 12 px floor: the prompt, 'Tap now' and 'Tap to begin'. */
#prompt {
  position: absolute; z-index: 5; left: 6%; right: 6%; bottom: 9%; text-align: center;
  font-size: max(12px, calc(var(--u) * 3.96)); font-weight: 500; color: var(--ui-ink); text-wrap: balance;
  opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
}
#prompt.on { opacity: 1; }
#prompt.urgent { animation: blink 0.36s steps(2, jump-none) infinite; }

/* The dialogue panel: one slab holding the speaker's label, the line and the choices. Its least height is a
   labelled two-line line's, so narration (no label) takes the same box, its line centred in it. */
#dialog {
  position: absolute; z-index: 6; left: calc(var(--gp) * 6); right: calc(var(--gp) * 6); bottom: calc(var(--gp) * 6);
  max-height: var(--dlg-max, 46%); display: flex; flex-direction: column;
  min-height: min(var(--dlg-max, 46%), calc(var(--gp) * 17 + var(--who-fs) * 1.2 + 2.9em));
  padding: calc(var(--gp) * 6) calc(var(--gp) * 7) calc(var(--gp) * 8); /* 8 below: the ▾ stays clear of the last line */
  opacity: 0; transform: translateY(calc(var(--u) * 2)); transition: opacity 0.25s ease, transform 0.25s ease;
  pointer-events: none;
}
#dialog.on { opacity: 1; transform: none; pointer-events: auto; }
/* Speaker labels: small capitals, a little tracking, in the label colour. */
#who { flex: 0 0 auto; font-size: var(--who-fs); font-weight: 500; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ui-accent); margin-bottom: calc(var(--gp) * 3); }
#text { flex: 0 1 auto; min-height: 2.9em; overflow-y: auto; max-width: 34em; line-height: 1.45; text-wrap: balance; }
#dialog.nolabel #text { min-height: 0; margin: auto 0; }
#dialog.narr #text, #dialog.whisper #text { color: var(--ui-dim); }
#dialog.whisper #text { letter-spacing: 0.04em; }
#text .mark { display: inline-block; transform: scaleX(-1) translateY(0.14em); }
#dialog.red.on #text { animation: shiver 0.14s steps(2, jump-none) infinite; }
/* The choices: plain rows, each marker on the line's left edge and every row's words indented the same 6 game
   pixels past it, each row a 44 px target with no gap between them. */
#choices { flex: 0 0 auto; display: flex; flex-direction: column; gap: 0; margin: calc(var(--gp) * 2) 0 0; }
#choices[hidden] { display: none; }
/* The panel stays below the waterline (dlgCap). While buttons show, the question may scroll so the buttons fit;
   when that would leave less than two lines of it, the panel tightens (#dialog.tight), and if four or more
   rows still do not fit they become a grid of plates, two columns sized by their words, each a slab one step
   lighter than the panel ringed so it shows in the red too (--plate), the words wrapping inside beside the
   marker, an odd last plate spanning both columns (fitChoices). */
#dialog.choosing #text { min-height: 0; }
#dialog.choosing { padding-bottom: calc(var(--gp) * 6); } /* no ▾ while answers show */
#dialog.tight { padding-top: calc(var(--gp) * 4); padding-bottom: calc(var(--gp) * 4); }
#dialog.tight #who { margin-bottom: calc(var(--gp) * 2); }
#dialog.tight #choices { margin-top: var(--gp); }
#choices.grid { display: grid; grid-template-columns: auto auto; gap: calc(var(--gp) * 2); margin-top: calc(var(--gp) * 2); }
#choices.grid .choice { padding: calc(var(--gp) * 2) calc(var(--gp) * 3) calc(var(--gp) * 2) calc(var(--gp) * 9); border-image: var(--plate) var(--k) fill / calc(var(--gp) * var(--k)) stretch; }
#choices.grid.odd .choice:last-child { grid-column: 1 / -1; }
#choices.grid .choice:focus-visible { border-image-source: var(--hi); }
#choices.grid .lb { text-wrap: balance; }
/* The first moments after buttons appear: a tap meant to finish the line must not pick one. */
#choices.cold .choice, #thinkChoices.cold .choice { pointer-events: none; }
/* A choice is his own words: the book face at 500, a step brighter than the dim line colour, after the marker.
   Hovered or focused, the words brighten to the pale ink; a keyboard focus also lays a slab one step lighter
   under the row. Pressed, the row drops one game pixel. */
.choice {
  position: relative; font: inherit; font-weight: 500; line-height: 1.3; text-align: left; color: var(--ui-row);
  background: none; border: 0 solid transparent; cursor: pointer; min-height: 44px;
  padding: var(--gp) calc(var(--gp) * 3) var(--gp) calc(var(--gp) * 6);
}
.choice .lb { display: block; position: relative; }
.choice .lb::before { left: calc(var(--gp) * -6); top: calc((1.3em - var(--gp) * 5) / 2); }
.choice:hover, .choice:focus-visible { color: var(--ui-pale); outline: none; }
.choice:focus-visible { border-image: var(--row) var(--k) fill / calc(var(--gp) * var(--k)) stretch; }
.choice:active { transform: translateY(var(--gp)); }
#more { right: calc(var(--gp) * 6); bottom: calc(var(--gp) * 3); }
#more.on, #thinkMore.on { opacity: 0.9; animation: nudge 0.9s steps(2, jump-none) infinite; }

/* The thought bubble (bible, 4b): a solid pixel cloud on the game's own grid, drawn by thinkLayout as SVG rects
   in game pixels (#thinkPix): a one-game-pixel outline in the ink, the palette's darkest index inside, and three
   shrinking pixel circles as the tail toward whoever is thinking. Its box is sized from the measured text, in
   whole game pixels, with the same padding above and below and at either side, the words centred in it, at
   the story size. The companion's question is a bubble like his others; its two answers sit on a slab directly
   above it, in the sky (#thinkChoices), clear of the man, the companion, the lantern and the tail. */
#think {
  position: absolute; z-index: 6; color: var(--ui-ink); display: flex; flex-direction: column; justify-content: center;
  padding: calc(var(--gp) * 5) calc(var(--gp) * 7);
  line-height: 1.45; text-align: center;
  opacity: 0; transition: opacity 0.35s ease; pointer-events: none;
}
#think.on { opacity: 1; }
#think.ask { pointer-events: auto; }
#thinkPix { position: absolute; overflow: visible; shape-rendering: crispEdges; pointer-events: none; }
#thinkPix .fill { fill: var(--ui-solid); }
#thinkPix .line { fill: var(--ui-ink); fill-opacity: 0.9; }
#thinkText { position: relative; text-wrap: balance; }
#thinkText .mark { display: inline-block; transform: scaleX(-1) translateY(0.14em); }
/* The answers' slab: as wide as the cloud (or its words), its left edge on the cloud's, ringed in the cloud's own
   ink, 5 game pixels above its bumps. Each row is a 44 px target, but the first row's words sit at the bottom of
   its target and the last row's at the top (--gap game pixels from the line between them), so the two answers
   read as a short list; the slab you see (::before) hugs the words, inset from the targets by --ins (whole game
   pixels), and the targets reach past it into the sky. */
#thinkChoices {
  --gap: calc(var(--gp) * 2); --pad: calc(44px - 1.3em - var(--gap));
  --ins: calc(var(--pad) - var(--gp) * 3);
  --ins: max(0px, round(down, calc(var(--pad) - var(--gp) * 3), var(--gp)));
  position: absolute; left: 0; bottom: 100%; margin-bottom: calc(var(--gp) * 5 - var(--ins)); display: flex; flex-direction: column;
  width: max-content; min-width: 100%;
  padding: 0 calc(var(--gp) * 6) 0 calc(var(--gp) * 5); text-align: left;
  font-size: calc(var(--u) * 3.96); line-height: 1.45; border-image: none;
}
#thinkChoices::before { content: ''; position: absolute; left: 0; right: 0; top: var(--ins); bottom: var(--ins);
  border: 0 solid transparent; border-image: var(--ask) var(--k) fill / calc(var(--gp) * var(--k)) stretch; pointer-events: none; }
#thinkChoices .choice { padding-top: var(--gap); padding-bottom: var(--gap); }
#thinkChoices .choice:first-child { padding-top: max(0px, var(--pad)); }
#thinkChoices .choice:last-child { padding-bottom: max(0px, var(--pad)); }
#thinkChoices[hidden] { display: none; }
/* The same 'more' marker as the panel's, set after the bubble's last word and kept on its line (glueTail), so
   it always sits inside the cloud, for a bubble that waits for a tap. */
#thinkMore { position: relative; display: inline-block; vertical-align: baseline; margin-left: calc(var(--gp) * 2); }
#thinkMore[hidden] { display: none; }

/* The catch card: a slab where the panel lives, so the boat, the man and the line stay in view above it. Its
   'Tap to continue' is for screen readers; the eye gets the ▾ marker once CARD_GRACE has passed. */
#card {
  position: absolute; z-index: 6; left: calc(var(--gp) * 6); right: calc(var(--gp) * 6); bottom: calc(var(--gp) * 6);
  padding: calc(var(--gp) * 6) calc(var(--gp) * 7) calc(var(--gp) * 8); text-align: center;
  opacity: 0; transform: translateY(calc(var(--u) * 2)); transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none;
}
#card.on { opacity: 1; transform: none; }
/* The fish sits centred in a box of one height for every species (cardScale), so the card never jumps. */
#cardFish { display: block; margin: 0 auto calc(var(--gp) * 4); image-rendering: crisp-edges; image-rendering: pixelated; }
#cardName { font-size: calc(var(--u) * 4.6); font-weight: 500; line-height: 1.2; }
#cardMeta { margin-top: calc(var(--gp) * 1.5); color: var(--ui-dim); font-size: max(11px, calc(var(--u) * 3.06)); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
:root[lang="ru"] #cardMeta { font-size: max(12px, calc(var(--u) * 3.06)); }
#cardDesc { margin: calc(var(--gp) * 4) 0 0; text-wrap: balance; }
#cardVoice { margin: calc(var(--gp) * 3) 0 0; color: var(--ui-accent); font-style: italic; text-wrap: balance; }
#card::after { content: ''; right: calc(var(--gp) * 6); bottom: calc(var(--gp) * 4); transition: opacity 0.3s ease; }
#card.ready::after { opacity: 1; animation: nudge 0.9s steps(2, jump-none) infinite; }

/* The title: the pixel name (logoSVG, set on a whole game-pixel column and row by placeLogo), 'Tap to begin',
   and, once an ending has been found, one quiet line counting them. */
#title {
  position: absolute; z-index: 7; inset: 0; display: flex; flex-direction: column; align-items: center;
  text-align: center; opacity: 0; transition: opacity 1.1s ease; pointer-events: none;
}
#title.on { opacity: 1; }
#title h1 { position: absolute; left: 0; top: 0; margin: 0; line-height: 0; }
#title h1 svg { display: block; overflow: visible; }
#title .begin { position: absolute; bottom: 21%; left: 0; right: 0; margin: 0; font-size: max(12px, calc(var(--u) * 3.96)); font-weight: 500; animation: breathe 2.6s ease-in-out infinite; }
#found { position: absolute; bottom: var(--found-bottom, 9.5%); left: 0; right: 0; width: max-content; margin: 0 auto; padding: calc(var(--gp) * 2) calc(var(--gp) * 5);
  font-size: max(11px, calc(var(--u) * 2.79)); font-weight: 500; color: var(--ui-row); }
#found:empty { display: none; }

#fade { position: absolute; z-index: 8; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 0.6s ease; }

/* The ending: one slab holding the title, the text, a one-game-pixel divider, what you asked for, the endings
   found as pips, and Cast again. The words are in the pale ink; only the title, the divider and the pips take
   the mood's colour. */
#ending {
  position: absolute; z-index: 9; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 0 calc(var(--gp) * 6);
  background: color-mix(in srgb, var(--ui-solid) 55%, transparent);
  opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
}
#ending.on { opacity: 1; pointer-events: auto; }
.endBox { display: flex; flex-direction: column; align-items: center; width: 100%; padding: calc(var(--gp) * 11) calc(var(--gp) * 8) calc(var(--gp) * 10); }
#ending h2 { margin: 0 -0.1em 0 0; font-size: calc(var(--u) * 5.4); font-weight: 500; line-height: 1.2; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ui-ink); }
#endText { margin: calc(var(--gp) * 7) 0 0; color: var(--ui-pale); max-width: 30em; line-height: 1.5; text-wrap: pretty; }
#endAsked { position: relative; margin: calc(var(--gp) * 6) 0 0; padding-top: calc(var(--gp) * 6); color: var(--ui-pale); max-width: 30em; line-height: 1.5; white-space: pre-line; }
#endAsked:empty { display: none; }
#endAsked .head { display: block; color: var(--ui-dim); text-wrap: balance; }
#endAsked::before { content: ''; position: absolute; top: 0; left: 50%; width: calc(var(--gp) * 14); height: var(--gp); margin-left: calc(var(--gp) * -7); background: var(--ui-line); }
/* Pips: a 3-game-pixel mark per ending on one box, solid when found, a ring (3:1) when not, then the count. */
.pips { display: flex; align-items: center; justify-content: center; gap: calc(var(--gp) * 3); margin: calc(var(--gp) * 7) 0 0; }
.pips[hidden] { display: none; }
.pips i { box-sizing: border-box; width: calc(var(--gp) * 3); height: calc(var(--gp) * 3); border: var(--gp) solid var(--ui-line); }
.pips i.on { background: var(--ui-ink); border-color: var(--ui-ink); }
.pips b { margin-left: calc(var(--gp) * 2); font-size: max(11px, calc(var(--u) * 2.88)); font-weight: 500; color: var(--ui-dim); font-variant-numeric: tabular-nums; }
/* Cast again: a raised slab (index 1 ringed in the line colour, 3:1) with the choice marker before its words,
   its insets equal by eye (6 game pixels to the marker, 6 after the words); hovered or focused its ring
   lightens (--hi) and its words brighten. */
#again {
  position: relative; margin-top: calc(var(--gp) * 8); min-height: 44px; padding: calc(var(--gp) * 3) calc(var(--gp) * 6) calc(var(--gp) * 3) calc(var(--gp) * 12);
  font: inherit; font-weight: 500; color: var(--ui-ink); background: none; cursor: pointer;
  border: 0 solid transparent; border-image: var(--raise) var(--k) fill / calc(var(--gp) * var(--k)) stretch;
}
#again::before { left: calc(var(--gp) * 6); top: 50%; margin-top: calc(var(--gp) * -2.5); }
#again:not(:disabled):hover, #again:focus-visible { outline: none; border-image-source: var(--hi); color: var(--ui-pale); }
#again:not(:disabled):active { transform: translateY(var(--gp)); }
#again:disabled { cursor: default; opacity: 0.4; }

@keyframes blink { 50% { opacity: 0.35; } }
@keyframes shiver { 50% { transform: translate(0.05em, -0.04em); } }
@keyframes nudge { 50% { transform: translateY(var(--gp)); } }
@keyframes breathe { 50% { opacity: 0.7; } }
@media (prefers-reduced-motion: reduce) {

}
