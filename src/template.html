<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a33">
<title>Still Water</title>
<meta name="description" content="A short fishing tale">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..500;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* One face (chosen in a font lab over real frames, English and Russian, at phone sizes): Literata, a book serif
   with a strong Cyrillic and an optical-size axis, for every word on screen. The title is pixel lettering on
   the game grid (logoSVG), not type.
   One kind of box (the quiet slab, chosen in a UI lab): every box is one opaque slab in the palette's darkest
   index on the game-pixel grid, a one-game-pixel notch at each corner and a one-game-pixel outline one step
   lighter. UI.colors draws the slabs as tiny SVGs from the live palette (--slab, --raise, --hi, --row) and
   border-image nine-slices them at --k game pixels, so every box recolours with the mood. */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --page-bg: #0a1a33;
  --page-ink: #eaf7ff;
  --ui-solid: #0a1a33;
  --ui-edge: #3673b1;
  --ui-ink: #f1f9ff;
  --ui-pale: #f9fdff;
  --ui-row: #c3def3;
  --ui-dim: #99c4e7;
  --ui-accent: #e2aa2a;
  --slab: none; --raise: none; --hi: none; --row: none; --k: 2;
  --u: 3.6px;
  --gp: 1px; /* one game pixel in CSS px, set by resize */
  --font: Literata, 'PT Serif', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #07142a; --page-ink: #eaf7ff; }
}
:root[data-theme="dark"] { --page-bg: #07142a; --page-ink: #eaf7ff; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  height: 100%;
  background: var(--page-bg);
  color: var(--page-ink);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font); font-optical-sizing: auto; font-synthesis: none;
}
:root[lang="ru"] body { -webkit-hyphens: manual; hyphens: manual; }
#wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#stage {
  position: relative; overflow: hidden; width: 216px; height: 384px;
  font-size: calc(var(--u) * 3.96); line-height: 1.45; color: var(--ui-ink);
  touch-action: none; cursor: pointer;
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
/* Words kept for screen readers only. */
.sr { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* The slab: one opaque box on the game grid (see the head of this sheet). */
.slab { border: 0 solid transparent; border-image: var(--slab) var(--k) fill / calc(var(--gp) * var(--k)) stretch; }
.slab:empty { border-image: none; }
/* Loose text over the picture (the prompt, 'Tap to begin'): a one-game-pixel outline in the darkest index. */
.shade { text-shadow: var(--gp) 0 0 var(--ui-solid), calc(var(--gp) * -1) 0 0 var(--ui-solid), 0 var(--gp) 0 var(--ui-solid), 0 calc(var(--gp) * -1) 0 var(--ui-solid),
  0 calc(var(--gp) * 2) 0 var(--ui-solid); }
/* The pixel markers: a 2 by 3 game-pixel triangle pointing right for a choice, a 5 by 3 one pointing down for
   'more' (the panel, the bubble and the catch card), drawn with clip-path so no glyph falls back to a system font. */
.choice::before, #again::before {
  content: ''; position: absolute; top: 50%; margin-top: calc(var(--gp) * -1.5); width: calc(var(--gp) * 2); height: calc(var(--gp) * 3);
  clip-path: polygon(0 0, 50% 0, 50% 33.34%, 100% 33.34%, 100% 66.67%, 50% 66.67%, 50% 100%, 0 100%);
}
.pxmore, #card::after {
  position: absolute; width: calc(var(--gp) * 5); height: calc(var(--gp) * 3); background: var(--ui-accent); opacity: 0;
  clip-path: polygon(0 0, 100% 0, 100% 33.34%, 80% 33.34%, 80% 66.67%, 60% 66.67%, 60% 100%, 40% 100%, 40% 66.67%, 20% 66.67%, 20% 33.34%, 0 33.34%);
}

/* The HUD: the fish count on a small slab, and 44 px buttons, each a 15 by 11 game-pixel slab under a pixel
   icon (Mute, Skip) or a two-letter code (the language link, on the title only). */
#hud {
  position: absolute; z-index: 5; top: calc(var(--gp) * 2); left: calc(var(--gp) * 4); right: var(--gp);
  display: flex; justify-content: space-between; align-items: center;
  font-size: max(11px, calc(var(--u) * 2.97)); font-weight: 500; pointer-events: none;
}
#count { color: var(--ui-ink); line-height: calc(var(--gp) * 11); padding: 0 calc(var(--gp) * 4); font-variant-numeric: tabular-nums; }
#count:empty { visibility: hidden; }
#hudButtons { display: flex; align-items: center; }
#mute, #skip, #lang {
  pointer-events: auto; position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; margin: 0; padding: 0; background: none; border: 0; cursor: pointer;
  font: 500 max(11px, calc(var(--u) * 2.97))/1 var(--font); letter-spacing: 0.08em; color: var(--ui-ink); text-decoration: none;
}
#mute::before, #skip::before, #lang::before {
  content: ''; position: absolute; z-index: -1; left: 50%; top: 50%;
  width: calc(var(--gp) * 15); height: calc(var(--gp) * 11); margin: calc(var(--gp) * -5.5) 0 0 calc(var(--gp) * -7.5);
  border: 0 solid transparent; border-image: var(--slab) var(--k) fill / calc(var(--gp) * var(--k)) stretch;
}
#skip[hidden], #lang[hidden] { display: none; }
#skip { opacity: 0.75; }
.icon { display: block; fill: currentColor; shape-rendering: crispEdges; }
#mute .icon { width: calc(var(--gp) * 9); height: calc(var(--gp) * 7); }
#skip .icon { width: calc(var(--gp) * 7); height: calc(var(--gp) * 5); }
#mute .off, #mute[data-muted="1"] .on { display: none; }
#mute[data-muted="1"] .off { display: block; }
#mute:focus-visible, #skip:focus-visible, #lang:focus-visible { outline: none; }
#mute:focus-visible::before, #skip:focus-visible::before, #lang:focus-visible::before { border-image-source: var(--hi); }
#mute:active, #skip:active, #lang:active { transform: translateY(var(--gp)); }

/* The caption: a slab hugging its words (hug). On the title (only the test build's T key puts one there) it
   sits low, clear of the name. */
#caption {
  position: absolute; z-index: 5; top: 11%; left: 0; right: 0; width: 82%; margin: 0 auto; text-align: center;
  padding: calc(var(--gp) * 3) calc(var(--gp) * 6);
  font-size: calc(var(--u) * 3.6); color: var(--ui-ink); text-wrap: balance;
  opacity: 0; transition: opacity 0.9s ease; pointer-events: none;
}
#caption.on { opacity: 1; }
#caption.whisper { color: var(--ui-dim); letter-spacing: 0.04em; }
#stage.titling #caption { top: auto; bottom: 30%; z-index: 8; }
#prompt {
  position: absolute; z-index: 5; left: 6%; right: 6%; bottom: 9%; text-align: center;
  font-size: calc(var(--u) * 3.33); font-weight: 500; color: var(--ui-ink);
  opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
}
#prompt.on { opacity: 0.92; }
#prompt.urgent { font-size: calc(var(--u) * 4.14); animation: blink 0.36s steps(2, jump-none) infinite; }

/* The dialogue panel: one slab holding the speaker's label, the line and the choices. */
#dialog {
  position: absolute; z-index: 6; left: calc(var(--gp) * 6); right: calc(var(--gp) * 6); bottom: calc(var(--gp) * 6);
  max-height: var(--dlg-max, 46%); display: flex; flex-direction: column;
  padding: calc(var(--gp) * 6) calc(var(--gp) * 7);
  opacity: 0; transform: translateY(calc(var(--u) * 2)); transition: opacity 0.25s ease, transform 0.25s ease;
  pointer-events: none;
}
#dialog.on { opacity: 1; transform: none; pointer-events: auto; }
/* Speaker labels: small capitals, a little tracking, in the label colour. */
#who { flex: 0 0 auto; font-size: 11px; font-weight: 500; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ui-accent); margin-bottom: calc(var(--gp) * 3); }
#text { flex: 0 1 auto; min-height: 2.9em; overflow-y: auto; max-width: 34em; line-height: 1.45; text-wrap: pretty; }
#dialog.narr #text, #dialog.whisper #text { color: var(--ui-dim); }
#dialog.whisper #text { letter-spacing: 0.04em; }
#text .mark { display: inline-block; transform: scaleX(-1) translateY(0.14em); }
#dialog.red #who { color: var(--ui-dim); }
#dialog.red.on #text { animation: shiver 0.14s steps(2, jump-none) infinite; }
/* The choices: plain rows, their words flush with the line's, each a 44 px target with no gap between them. */
#choices { flex: 0 0 auto; display: flex; flex-direction: column; gap: 0; margin: calc(var(--gp) * 2) 0 0 calc(var(--gp) * -5); }
#choices[hidden] { display: none; }
/* While buttons show, the question may scroll so the buttons fit; only when one column of them would leave
   less than two lines of the question do they sit in two columns (fitChoices). */
#dialog.choosing #text { min-height: 0; }
#choices.grid { display: grid; grid-template-columns: 1fr 1fr; }
/* The first moments after buttons appear: a tap meant to finish the line must not pick one. */
#choices.cold .choice, #thinkChoices.cold .choice { pointer-events: none; }
/* A choice is his own words: the book face at 500, a step brighter than the dim line colour, a dim marker
   at rest. Hovered or focused, the marker lights in the accent and the words go to the ink; a keyboard focus
   also lays a slab one step lighter under the row. Pressed, the row drops one game pixel. */
.choice {
  position: relative; font: inherit; font-weight: 500; line-height: 1.3; text-align: left; color: var(--ui-row);
  background: none; border: 0 solid transparent; cursor: pointer; min-height: 44px;
  padding: var(--gp) calc(var(--gp) * 3) var(--gp) calc(var(--gp) * 5);
}
.choice::before { left: calc(var(--gp) * 1.5); background: currentColor; opacity: 0.45; }
.choice:hover, .choice:focus-visible { color: var(--ui-ink); outline: none; }
.choice:hover::before, .choice:focus-visible::before { background: var(--ui-accent); opacity: 1; }
.choice:focus-visible { border-image: var(--row) var(--k) fill / calc(var(--gp) * var(--k)) stretch; }
.choice:active { transform: translateY(var(--gp)); }
#more { right: calc(var(--gp) * 6); bottom: calc(var(--gp) * 4); }
#more.on, #thinkMore.on { opacity: 0.9; animation: nudge 0.9s steps(2, jump-none) infinite; }

/* The thought bubble (bible, 4b): a solid pixel cloud on the game's own grid, drawn by thinkLayout as SVG rects
   in game pixels (#thinkPix): a one-game-pixel outline in the ink, the palette's darkest index inside, and three
   shrinking pixel circles as the tail toward whoever is thinking. Its box is sized from the measured text, in
   whole game pixels. The companion's question holds its two answers inside the cloud, as rows. */
#think {
  position: absolute; z-index: 6; color: var(--ui-ink);
  padding: calc(var(--u) * 2.4) calc(var(--u) * 2.8) calc(var(--u) * 3.2);
  font-size: max(12px, calc(var(--u) * 2.79)); line-height: 1.45; text-align: center;
  opacity: 0; transition: opacity 0.35s ease; pointer-events: none;
}
#think.on { opacity: 1; }
#think.ask { pointer-events: auto; }
#thinkPix { position: absolute; overflow: visible; shape-rendering: crispEdges; pointer-events: none; }
#thinkPix .fill { fill: var(--ui-solid); }
#thinkPix .line { fill: var(--ui-ink); fill-opacity: 0.9; }
#thinkText { position: relative; text-wrap: balance; }
#thinkText .mark { display: inline-block; transform: scaleX(-1) translateY(0.14em); }
#thinkChoices { position: relative; display: flex; flex-direction: column; width: max-content; max-width: 100%; margin: calc(var(--gp) * 2) auto 0; }
#thinkChoices[hidden] { display: none; }
#thinkChoices .choice { font-size: max(15px, calc(var(--u) * 3.96)); color: var(--ui-ink); padding-right: calc(var(--gp) * 4); }
/* The same 'more' marker as the panel's, inside the bubble's lower right, for a bubble that waits for a tap. */
#thinkMore { right: calc(var(--gp) * 8); bottom: calc(var(--gp) * 3); }

/* The catch card: a slab where the panel lives, so the boat, the man and the line stay in view above it. Its
   'Tap to continue' is for screen readers; the eye gets the ▾ marker once CARD_GRACE has passed. */
#card {
  position: absolute; z-index: 6; left: calc(var(--gp) * 6); right: calc(var(--gp) * 6); bottom: calc(var(--gp) * 6);
  padding: calc(var(--gp) * 6) calc(var(--gp) * 8) calc(var(--gp) * 7); text-align: center;
  opacity: 0; transform: translateY(calc(var(--u) * 2)); transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none;
}
#card.on { opacity: 1; transform: none; }
#cardFish { display: block; margin: 0 auto calc(var(--gp) * 4); image-rendering: crisp-edges; image-rendering: pixelated; }
#cardName { font-size: calc(var(--u) * 4.6); font-weight: 500; line-height: 1.2; }
#cardMeta { margin-top: calc(var(--gp) * 1.5); color: var(--ui-dim); font-size: max(11px, calc(var(--u) * 3.06)); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
:root[lang="ru"] #cardMeta { font-size: max(12px, calc(var(--u) * 3.06)); }
#cardDesc { margin: calc(var(--gp) * 4) 0 0; text-wrap: balance; }
#cardVoice { margin: calc(var(--gp) * 3) 0 0; color: var(--ui-accent); font-style: italic; text-wrap: balance; }
#card::after { content: ''; right: calc(var(--gp) * 6); bottom: calc(var(--gp) * 4); transition: opacity 0.3s ease; }
#card.ready::after { opacity: 1; animation: nudge 0.9s steps(2, jump-none) infinite; }

/* The title: the pixel name (logoSVG, set on a whole game-pixel column and row by placeLogo), 'Tap to begin',
   and, once an ending has been found, one quiet line counting them. */
#title {
  position: absolute; z-index: 7; inset: 0; display: flex; flex-direction: column; align-items: center;
  text-align: center; opacity: 0; transition: opacity 1.1s ease; pointer-events: none;
}
#title.on { opacity: 1; }
#title h1 { position: absolute; left: 0; top: 0; margin: 0; line-height: 0; }
#title h1 svg { display: block; overflow: visible; }
#title .begin { position: absolute; bottom: 21%; left: 0; right: 0; margin: 0; font-size: max(13px, calc(var(--u) * 4.14)); font-weight: 500; animation: breathe 2.6s ease-in-out infinite; }
#found { position: absolute; bottom: 9.5%; left: 0; right: 0; width: max-content; margin: 0 auto; padding: calc(var(--gp) * 2) calc(var(--gp) * 5);
  font-size: max(11px, calc(var(--u) * 2.79)); font-weight: 500; color: var(--ui-row); }
#found:empty { display: none; }

#fade { position: absolute; z-index: 8; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 0.6s ease; }

/* The ending: one slab holding the title, the text, a one-game-pixel divider, what you asked for, the endings
   found as pips, and Cast again. The words are in the pale ink; only the title, the divider and the pips take
   the mood's colour. */
#ending {
  position: absolute; z-index: 9; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 0 calc(var(--gp) * 6);
  background: color-mix(in srgb, var(--ui-solid) 55%, transparent);
  opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
}
#ending.on { opacity: 1; pointer-events: auto; }
.endBox { display: flex; flex-direction: column; align-items: center; width: 100%; padding: calc(var(--gp) * 11) calc(var(--gp) * 8) calc(var(--gp) * 10); }
#ending h2 { margin: 0 -0.1em 0 0; font-size: calc(var(--u) * 5.4); font-weight: 500; line-height: 1.2; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ui-ink); }
#endText { margin: calc(var(--gp) * 7) 0 0; color: var(--ui-pale); max-width: 30em; line-height: 1.5; text-wrap: balance; }
#endAsked { position: relative; margin: calc(var(--gp) * 6) 0 0; padding-top: calc(var(--gp) * 6); color: var(--ui-pale); max-width: 30em; line-height: 1.5; white-space: pre-line; }
#endAsked:empty { display: none; }
#endAsked .head { color: var(--ui-dim); }
#endAsked::before { content: ''; position: absolute; top: 0; left: 50%; width: calc(var(--gp) * 14); height: var(--gp); margin-left: calc(var(--gp) * -7); background: var(--ui-dim); opacity: 0.6; }
/* Pips: a 3-game-pixel mark per ending, solid when found, an outline when not, then the count. */
.pips { display: flex; align-items: center; justify-content: center; gap: calc(var(--gp) * 3); margin: calc(var(--gp) * 7) 0 0; }
.pips[hidden] { display: none; }
.pips i { width: calc(var(--gp) * 3); height: calc(var(--gp) * 3); box-shadow: inset 0 0 0 var(--gp) var(--ui-dim); opacity: 0.6; }
.pips i.on { background: var(--ui-ink); box-shadow: none; opacity: 1; }
.pips b { margin-left: calc(var(--gp) * 2); font-size: max(11px, calc(var(--u) * 2.88)); font-weight: 500; color: var(--ui-dim); font-variant-numeric: tabular-nums; }
/* Cast again: a raised slab (index 1 on an index 2 outline); hovered or focused it takes the ink outline and
   lights the accent marker, with no ring. */
#again {
  position: relative; margin-top: calc(var(--gp) * 8); min-height: 44px; padding: calc(var(--gp) * 3) calc(var(--gp) * 10);
  font: inherit; font-weight: 500; color: var(--ui-pale); background: none; cursor: pointer;
  border: 0 solid transparent; border-image: var(--raise) var(--k) fill / calc(var(--gp) * var(--k)) stretch;
}
#again::before { left: calc(var(--gp) * 4); background: var(--ui-accent); opacity: 0; }
#again:not(:disabled):hover, #again:focus-visible { outline: none; border-image-source: var(--hi); }
#again:not(:disabled):hover::before, #again:focus-visible::before { opacity: 1; }
#again:not(:disabled):active { transform: translateY(var(--gp)); }
#again:disabled { cursor: default; opacity: 0.4; }

@keyframes blink { 50% { opacity: 0.35; } }
@keyframes shiver { 50% { transform: translate(0.05em, -0.04em); } }
@keyframes nudge { 50% { transform: translateY(var(--gp)); } }
@keyframes breathe { 50% { opacity: 0.7; } }
@media (prefers-reduced-motion: reduce) {
  #prompt.urgent, #dialog.red.on #text, #more.on, #thinkMore.on, #card.ready::after, #title .begin { animation: none; }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage" aria-label="Still Water, a short fishing tale">
    <canvas id="c" width="216" height="384"></canvas>
    <div id="hud"><span id="count" class="slab" aria-live="polite"></span><span id="hudButtons"><a id="lang" href="ru/" hreflang="ru" lang="ru" hidden>RU</a><button id="mute" type="button" aria-label="Mute" title="Mute"><svg class="icon on" viewBox="0 0 9 7" aria-hidden="true"><rect x="3" y="0" width="1" height="1"/><rect x="2" y="1" width="2" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="0" y="2" width="4" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="8" y="2" width="1" height="1"/><rect x="0" y="3" width="4" height="1"/><rect x="5" y="3" width="1" height="1"/><rect x="8" y="3" width="1" height="1"/><rect x="0" y="4" width="4" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="8" y="4" width="1" height="1"/><rect x="2" y="5" width="2" height="1"/><rect x="7" y="5" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/></svg><svg class="icon off" viewBox="0 0 9 7" aria-hidden="true"><rect x="3" y="0" width="1" height="1"/><rect x="2" y="1" width="2" height="1"/><rect x="0" y="2" width="4" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="0" y="3" width="4" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="0" y="4" width="4" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="2" y="5" width="2" height="1"/><rect x="3" y="6" width="1" height="1"/></svg></button><button id="skip" type="button" aria-label="Skip" title="Skip" hidden><svg class="icon" viewBox="0 0 7 5" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="0" y="1" width="2" height="1"/><rect x="4" y="1" width="2" height="1"/><rect x="0" y="2" width="3" height="1"/><rect x="4" y="2" width="3" height="1"/><rect x="0" y="3" width="2" height="1"/><rect x="4" y="3" width="2" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/></svg></button></span></div>
    <div id="caption" class="slab" aria-live="polite"></div>
    <div id="prompt" class="shade"></div>
    <div id="think" aria-live="polite">
      <svg id="thinkPix" aria-hidden="true"></svg>
      <div id="thinkText"></div>
      <div id="thinkChoices" hidden></div>
      <div id="thinkMore" class="pxmore" aria-hidden="true"></div>
    </div>
    <div id="card" class="slab" aria-live="polite">
      <canvas id="cardFish" width="8" height="8"></canvas>
      <div id="cardName"></div>
      <div id="cardMeta"></div>
      <p id="cardDesc"></p>
      <p id="cardVoice" hidden></p>
      <div class="hint sr">Tap to continue</div>
    </div>
    <div id="dialog" class="slab" aria-live="polite">
      <div id="who"></div>
      <div id="text"></div>
      <div id="choices" hidden></div>
      <div id="more" class="pxmore" aria-hidden="true"></div>
    </div>
    <div id="title">
      <h1 aria-label="Still Water"><span class="sr">Still Water</span></h1>
      <p class="begin shade">Tap to begin</p>
      <p id="found" class="slab"></p>
    </div>
    <div id="fade"></div>
