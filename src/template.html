<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a33">
<title>Still Water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --page-bg: #0a1a33;
  --page-ink: #eaf7ff;
  --ui-panel: rgba(10, 26, 51, 0.86);
  --ui-solid: #0a1a33;
  --ui-edge: #3673b1;
  --ui-ink: #f1f9ff;
  --ui-dim: #99c4e7;
  --ui-accent: #e2aa2a;
  --u: 3.6px;
  --font: 'Pixelify Sans', 'VT323', 'Courier New', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #07142a; --page-ink: #eaf7ff; }
}
:root[data-theme="dark"] { --page-bg: #07142a; --page-ink: #eaf7ff; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  height: 100%;
  background: var(--page-bg);
  color: var(--page-ink);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font);
  /* Pixelify Sans joins fi and fl into ligatures that read as "Ash" and "Aoat" at game sizes. */
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0;
}
#wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#stage {
  position: relative; overflow: hidden; width: 216px; height: 384px;
  font-size: calc(var(--u) * 4.4); line-height: 1.35; color: var(--ui-ink);
  touch-action: none; cursor: pointer;
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
.panel {
  background: var(--ui-panel);
  border: calc(var(--u) * 0.6) solid var(--ui-edge);
  box-shadow: 0 0 0 calc(var(--u) * 0.6) var(--ui-solid);
}
.shade { text-shadow: 0 0 calc(var(--u) * 1.4) var(--ui-solid), 0 calc(var(--u) * 0.35) 0 var(--ui-solid); }

#hud {
  position: absolute; z-index: 5; top: calc(var(--u) * 3); left: calc(var(--u) * 4); right: calc(var(--u) * 4);
  display: flex; justify-content: space-between; align-items: center;
  font-size: max(10px, calc(var(--u) * 3.3)); pointer-events: none;
}
#count { color: var(--ui-ink); opacity: 0.85; }
#mute, #skip {
  pointer-events: auto; font: inherit; color: var(--ui-ink); background: transparent; cursor: pointer;
  min-height: max(44px, calc(var(--u) * 11)); min-width: 44px;
  border: calc(var(--u) * 0.45) solid var(--ui-edge); padding: calc(var(--u) * 0.6) calc(var(--u) * 1.8);
  opacity: 0.8;
}
#skip { margin-left: calc(var(--u) * 1.5); border-style: dashed; }
#skip[hidden] { display: none; }
#mute:focus-visible, #skip:focus-visible, .choice:focus-visible, #again:focus-visible { outline: calc(var(--u) * 0.6) solid var(--ui-accent); outline-offset: calc(var(--u) * 0.5); }

#caption {
  position: absolute; z-index: 5; top: 11%; left: 9%; right: 9%; text-align: center;
  font-size: calc(var(--u) * 4); color: var(--ui-ink);
  opacity: 0; transition: opacity 0.9s ease; pointer-events: none;
}
#caption.on { opacity: 1; }
#caption.whisper { color: var(--ui-dim); letter-spacing: 0.08em; }
#prompt {
  position: absolute; z-index: 5; left: 6%; right: 6%; bottom: 9%; text-align: center;
  font-size: calc(var(--u) * 3.7); color: var(--ui-ink);
  opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
}
#prompt.on { opacity: 0.92; }
#prompt.urgent { font-weight: 600; font-size: calc(var(--u) * 4.6); animation: blink 0.36s steps(2, jump-none) infinite; }

#dialog {
  position: absolute; z-index: 6; left: 4%; right: 4%; bottom: calc(var(--u) * 4);
  max-height: var(--dlg-max, 46%); display: flex; flex-direction: column;
  padding: calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 3.4);
  opacity: 0; transform: translateY(calc(var(--u) * 2)); transition: opacity 0.25s ease, transform 0.25s ease;
  pointer-events: none;
}
#dialog.on { opacity: 1; transform: none; pointer-events: auto; }
#who { flex: 0 0 auto; font-weight: 600; font-size: max(10px, calc(var(--u) * 3.4)); color: var(--ui-accent); margin-bottom: calc(var(--u) * 1.2); }
#text { flex: 0 1 auto; min-height: 2.7em; overflow-y: auto; max-width: 34em; }
#dialog.narr #text, #dialog.whisper #text { color: var(--ui-dim); }
#dialog.whisper #text { letter-spacing: 0.08em; }
#text .mark { display: inline-block; transform: scaleX(-1) translateY(0.14em); }
#dialog.red #who { color: var(--ui-dim); }
#dialog.red.on #text { animation: shiver 0.14s steps(2, jump-none) infinite; }
#choices { flex: 0 0 auto; display: flex; flex-direction: column; gap: calc(var(--u) * 1.8); margin-top: calc(var(--u) * 2.8); }
#choices[hidden] { display: none; }
#choices.many { gap: max(6px, calc(var(--u) * 2)); margin-top: calc(var(--u) * 2.2); }
/* While buttons show, the question may scroll so the buttons fit; on a short stage four or more sit in two columns. */
#dialog.choosing #text { min-height: 0; }
#choices.grid { display: grid; grid-template-columns: 1fr 1fr; }
/* The first moments after buttons appear: a tap meant to finish the line must not pick one. */
#choices.cold .choice, #thinkChoices.cold .choice { pointer-events: none; }
#choices.many .choice { padding: calc(var(--u) * 1.05) calc(var(--u) * 2.4); font-size: calc(var(--u) * 4); }
.choice {
  font: inherit; text-align: left; color: var(--ui-ink); background: transparent; cursor: pointer;
  min-height: max(44px, calc(var(--u) * 11));
  border: calc(var(--u) * 0.5) solid var(--ui-edge);
  padding: calc(var(--u) * 1.7) calc(var(--u) * 2.8);
}
.choice:hover { background: var(--ui-edge); color: var(--ui-solid); }
#more { position: absolute; right: calc(var(--u) * 3.2); bottom: calc(var(--u) * 1.4); opacity: 0; color: var(--ui-accent); }
#more.on { opacity: 0.9; animation: nudge 0.9s steps(2, jump-none) infinite; }

/* The thought bubble (bible, 4b): a thin comic bubble over the stage in the UI ink, near-transparent, with a
   scalloped SVG outline drawn in currentColor and a tail of two circles toward whoever is thinking. Its
   position is set from internal pixels by UI.think; #thinkChoices is the companion's question only. */
#think {
  position: absolute; z-index: 6; width: 40%; color: var(--ui-ink);
  padding: calc(var(--u) * 2.4) calc(var(--u) * 2.8) calc(var(--u) * 2.2);
  font-size: max(12px, calc(var(--u) * 3.1)); line-height: 1.3; text-align: center;
  opacity: 0; transition: opacity 0.35s ease; pointer-events: none;
}
#think.on { opacity: 1; }
#think.ask { pointer-events: auto; }
#thinkSvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: var(--ui-solid); fill-opacity: 0.55; stroke: currentColor; stroke-width: 1px; }
#thinkWho {
  position: absolute; top: calc(var(--u) * -1.3); left: calc(var(--u) * 4);
  padding: 0 calc(var(--u) * 0.7); font-size: max(10px, calc(var(--u) * 2.4)); line-height: 1.1; color: var(--ui-dim);
  background: var(--ui-solid);
}
#thinkWho[hidden] { display: none; }
#thinkText { position: relative; }
#thinkText .mark { display: inline-block; transform: scaleX(-1) translateY(0.14em); }
#thinkChoices {
  position: absolute; left: -12%; right: -12%; top: 100%; margin-top: calc(var(--u) * 8);
  display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 1.2);
}
#thinkChoices[hidden] { display: none; }
#thinkChoices .choice { flex: 1 1 auto; text-align: center; padding: calc(var(--u) * 0.7) calc(var(--u) * 1.6); font-size: calc(var(--u) * 4); background: var(--ui-panel); }
#thinkChoices .choice:hover { background: var(--ui-edge); }
/* The same ▾ 'more' marker as the panel's, inside the bubble's lower right, for a bubble that waits for a tap. */
#thinkMore { position: absolute; right: calc(var(--u) * 2.4); bottom: calc(var(--u) * 0.6); opacity: 0; font-size: calc(var(--u) * 2.6); line-height: 1; color: var(--ui-accent); }
#thinkMore.on { opacity: 0.9; animation: nudge 0.9s steps(2, jump-none) infinite; }

#card {
  position: absolute; z-index: 6; left: 10%; right: 10%; top: 27%;
  padding: calc(var(--u) * 4) calc(var(--u) * 4) calc(var(--u) * 3.4); text-align: center;
  opacity: 0; transform: scale(0.96); transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none;
}
#card.on { opacity: 1; transform: none; }
#cardFish { display: block; margin: 0 auto calc(var(--u) * 3); image-rendering: crisp-edges; image-rendering: pixelated; }
#cardName { font-weight: 600; font-size: calc(var(--u) * 5.2); }
#cardMeta { color: var(--ui-dim); font-size: max(10px, calc(var(--u) * 3.4)); margin-top: calc(var(--u) * 0.6); }
#cardDesc { margin: calc(var(--u) * 2.4) 0 0; }
#cardVoice { margin: calc(var(--u) * 2) 0 0; color: var(--ui-accent); }
#card .hint { margin-top: calc(var(--u) * 3); font-size: max(10px, calc(var(--u) * 3.1)); color: var(--ui-dim); opacity: 0; transition: opacity 0.3s ease; }
#card.ready .hint { opacity: 1; }

#title {
  position: absolute; z-index: 7; inset: 0; display: flex; flex-direction: column; align-items: center;
  text-align: center; opacity: 0; transition: opacity 1.1s ease; pointer-events: none;
}
#title.on { opacity: 1; }
#title h1 {
  margin: 20% 0 0; font-size: calc(var(--u) * 13.5); font-weight: 600; line-height: 1; letter-spacing: 0.01em;
  color: var(--ui-ink);
}
#title .sub { margin: calc(var(--u) * 2.6) 0 0; font-size: max(10px, calc(var(--u) * 4.2)); color: var(--ui-dim); }
#title .begin { position: absolute; bottom: 21%; left: 0; right: 0; margin: 0; font-size: max(10px, calc(var(--u) * 4.6)); animation: breathe 2.6s ease-in-out infinite; }
#title .how { position: absolute; bottom: 15%; left: 10%; right: 10%; margin: 0; font-size: max(10px, calc(var(--u) * 3.3)); color: var(--ui-dim); }
#title .found { position: absolute; bottom: 8.5%; left: 0; right: 0; margin: 0; font-size: max(10px, calc(var(--u) * 3.1)); color: var(--ui-accent); }
/* The six ending titles in order under the counter, a dash for each one not found yet. */
.endlist { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 calc(var(--u) * 2.6); margin: 0; font-size: max(10px, calc(var(--u) * 2.9)); }
.endlist:empty { display: none; }
#title .endlist { position: absolute; bottom: 3%; left: 8%; right: 8%; color: var(--ui-dim); }

#fade { position: absolute; z-index: 8; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 0.6s ease; }

#ending {
  position: absolute; z-index: 9; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 0 11%;
  background: linear-gradient(to bottom, transparent 8%, rgba(0, 0, 0, 0.62) 32%, rgba(0, 0, 0, 0.62) 68%, transparent 92%);
  opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
}
#ending.on { opacity: 1; pointer-events: auto; }
#ending h2 { margin: 0; font-size: calc(var(--u) * 10); font-weight: 600; line-height: 1.05; color: #fff; }
#endText { margin: calc(var(--u) * 4) 0 0; color: #f3ece4; max-width: 30em; }
#endAsked { margin: calc(var(--u) * 2.4) 0 0; color: #f3ece4; max-width: 30em; white-space: pre-line; }
#endFound { margin: calc(var(--u) * 4) 0 0; font-size: max(10px, calc(var(--u) * 3.2)); color: #c9b9a8; }
#endList { margin-top: calc(var(--u) * 1.2); color: #a8998a; }
#again {
  margin-top: calc(var(--u) * 5); font: inherit; color: #fff; background: transparent; cursor: pointer;
  min-height: max(44px, calc(var(--u) * 11));
  border: calc(var(--u) * 0.6) solid #fff; padding: calc(var(--u) * 1.8) calc(var(--u) * 5);
}
#again:not(:disabled):hover { background: #fff; color: #000; }
#again:disabled { cursor: default; }

@keyframes blink { 50% { opacity: 0.35; } }
@keyframes shiver { 50% { transform: translate(0.05em, -0.04em); } }
@keyframes nudge { 50% { transform: translateY(0.15em); } }
@keyframes breathe { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) {
  #prompt.urgent, #dialog.red.on #text, #more.on, #thinkMore.on, #title .begin { animation: none; }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage" aria-label="Still Water, a short fishing tale">
    <canvas id="c" width="216" height="384"></canvas>
    <div id="hud"><span id="count" class="shade" aria-live="polite"></span><span><button id="mute" type="button">Mute</button><button id="skip" type="button" hidden>Skip fish</button></span></div>
    <div id="caption" class="shade" aria-live="polite"></div>
    <div id="prompt" class="shade"></div>
    <div id="think" aria-live="polite">
      <svg id="thinkSvg" aria-hidden="true"><path id="thinkPath" d=""/><circle id="thinkTail1" r="0"/><circle id="thinkTail2" r="0"/></svg>
      <div id="thinkWho" hidden>Fisherman</div>
      <div id="thinkText" class="shade"></div>
      <div id="thinkChoices" hidden></div>
      <div id="thinkMore" aria-hidden="true">&#9662;</div>
    </div>
    <div id="card" class="panel" aria-live="polite">
      <canvas id="cardFish" width="8" height="8"></canvas>
      <div id="cardName"></div>
      <div id="cardMeta"></div>
      <p id="cardDesc"></p>
      <p id="cardVoice" hidden></p>
      <div class="hint">Tap to continue</div>
    </div>
    <div id="dialog" class="panel" aria-live="polite">
      <div id="who"></div>
      <div id="text"></div>
      <div id="choices" hidden></div>
      <div id="more" aria-hidden="true">&#9662;</div>
    </div>
    <div id="title" class="shade">
      <h1>Still Water</h1>
      <p class="sub shade">A short fishing tale</p>
      <p class="begin">Tap to begin</p>
      <p class="how shade">Tap to cast. Tap when the float goes under. Hold to reel.</p>
      <p class="found" id="found"></p>
      <p class="endlist" id="foundList"></p>
    </div>
    <div id="fade"></div>
    <div id="ending" aria-live="polite">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <p id="endAsked"></p>
      <p id="endFound"></p>
      <p class="endlist" id="endList"></p>
      <button id="again" type="button" disabled tabindex="-1">Cast again</button>
    </div>
  </div>
</div>
<script>
/*GAME*/
</script>
</body>
</html>
